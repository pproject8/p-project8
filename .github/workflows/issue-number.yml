name: 이슈 번호 붙이기

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  number:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { numberedTitle } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-title.js`);
            const issue = context.payload.issue;
            const title = numberedTitle(issue.title, issue.number);
            if (title !== issue.title) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, title });
            }
